<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --bg3: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --text2: #8b949e;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --blue: #58a6ff;
    --purple: #bc8cff;
    --cyan: #39d2c0;
    --orange: #f0883e;
    --pink: #db61a2;
    --card-radius: 8px;
    --transition: 0.2s ease;
  }
  html { font-size: 14px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }
  .header {
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    background: var(--bg2);
  }
  .header h1 {
    font-size: 1.25rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header h1 .logo { color: var(--cyan); }
  .header-status {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text2);
    font-size: 0.85rem;
  }
  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }
  .status-dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-dot.yellow { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
  .status-dot.red { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .last-refresh { font-size: 0.75rem; color: var(--text2); }

  .container { max-width: 1440px; margin: 0 auto; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    padding: 16px;
    overflow: hidden;
  }
  .card-title {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text2);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-title .badge {
    background: var(--bg3);
    color: var(--text2);
    font-size: 0.65rem;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 500;
  }

  .col-12 { grid-column: span 12; }
  .col-6 { grid-column: span 6; }
  .col-4 { grid-column: span 4; }
  .col-3 { grid-column: span 3; }

  .empty-state { text-align: center; padding: 24px 8px; color: var(--text2); font-size: 0.85rem; }
  .empty-state .icon { font-size: 1.5rem; margin-bottom: 4px; opacity: 0.5; }

  .health-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 0; border-bottom: 1px solid var(--bg3); font-size: 0.85rem;
  }
  .health-row:last-child { border-bottom: none; }
  .health-label { color: var(--text2); }
  .health-value { font-weight: 600; font-variant-numeric: tabular-nums; }

  .stat-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .stat-box {
    background: var(--bg3); border-radius: 6px; padding: 10px 8px; text-align: center;
  }
  .stat-number {
    font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--blue);
  }
  .stat-number.green { color: var(--green); }
  .stat-number.yellow { color: var(--yellow); }
  .stat-number.purple { color: var(--purple); }
  .stat-number.cyan { color: var(--cyan); }
  .stat-number.orange { color: var(--orange); }
  .stat-label { font-size: 0.65rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }

  .bar-chart { margin-top: 4px; }
  .bar-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 0.75rem;
  }
  .bar-label {
    width: 60px; flex-shrink: 0; text-align: right; color: var(--text2); font-size: 0.7rem;
  }
  .bar-track { flex: 1; height: 14px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width var(--transition); min-width: 2px; }
  .bar-fill.blue { background: linear-gradient(90deg, #1f6feb, var(--blue)); }
  .bar-fill.green { background: linear-gradient(90deg, #238636, var(--green)); }
  .bar-fill.cyan { background: linear-gradient(90deg, #1a7f72, var(--cyan)); }
  .bar-fill.orange { background: linear-gradient(90deg, #9b5100, var(--orange)); }
  .bar-fill.purple { background: linear-gradient(90deg, #512b8a, var(--purple)); }
  .bar-value { width: 44px; flex-shrink: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 0.7rem; }

  .insight-item {

  }
  .insight-item:last-child { border-bottom: none; }
  .insight-header { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
  .insight-title { font-weight: 600; }
  .insight-type {
    font-size: 0.6rem; padding: 1px 5px; border-radius: 3px;
    background: var(--bg3); color: var(--text2); text-transform: uppercase;

  .insight-desc { color: var(--text2); font-size: 0.75rem; }
  .insight-status {
    display: inline-block; font-size: 0.6rem; padding: 1px 5px; border-radius: 3px; background: var(--bg3);

  .insight-status.done { background: #1a3a2a; color: var(--green); }
  .insight-status.pending { background: #3a2a1a; color: var(--yellow); }

// ── Helpers ────────────────────────────────────────────────────────────

function $(id) { return document.getElementById(id); }

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function truncate(s, n) {
  if (!s) return '';
  return s.length > n ? s.slice(0, n) + '…' : s;
}

function formatNumber(n) {
  if (n == null) return '0';
  n = Number(n);
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return n.toLocaleString();
}

function timeAgo(iso) {
  if (!iso) return '—';
  const then = new Date(iso);
  const now = new Date();
  const diff = (now - then) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  const days = Math.floor(diff / 86400);
  return days + 'd ago';
}

function shortId(sid) {
  if (!sid) return '—';
  return sid.length > 12 ? sid.slice(0, 8) + '…' : sid;
}

// ── Card Builder ───────────────────────────────────────────────────────

function makeCard(id, title, cols, badge) {
  const div = document.createElement('div');
  div.className = 'card ' + cols;
  div.id = id;
  const header = document.createElement('div');
  header.className = 'card-title';
  header.innerHTML = '<span>' + escapeHtml(title) + '</span>' +
    (badge ? '<span class="badge">' + escapeHtml(badge) + '</span>' : '');
  div.appendChild(header);
  const body = document.createElement('div');
  body.className = 'card-body';
  div.appendChild(body);
  return div;
}

function setCardBody(id, html) {
  const card = $(id);
  if (!card) return;
  const body = card.querySelector('.card-body');
  if (body) body.innerHTML = html;
}

    '  <div class="stat-box"><div class="stat-number cyan">' + db.total_skills + '</div><div class="stat-label">Skills</div></div>',
    '  <div class="stat-box"><div class="stat-number yellow">' + db.total_patterns + '</div><div class="stat-label">Patterns</div></div>',
    '  <div class="stat-box"><div class="stat-number">' + db.total_memories + '</div><div class="stat-label">Memories</div></div>',
    '  <div class="stat-box"><div class="stat-number">' + db.total_agents + '</div><div class="stat-label">Agents</div></div>',
    '  <div class="stat-box"><div class="stat-number orange">' + formatNumber(db.total_tool_calls) + '</div><div class="stat-label">Tool Calls</div></div>',
    '</div>'
  ].join(''));
}

function renderCostUsage() {
  const data = MOCK.analytics;
  const maxTokens = Math.max(...data.map(d => d.total_tokens_input + d.total_tokens_output), 1);
  const maxCost = Math.max(...data.map(d => d.total_cost), 0.001);

  const tokenBars = data.map(d => {
    const tokens = d.total_tokens_input + d.total_tokens_output;
    const pct = (tokens / maxTokens * 100).toFixed(1);
    return '<div class="bar-row">' +
      '<span class="bar-label">' + escapeHtml(d.date) + '</span>' +
      '<div class="bar-track"><div class="bar-fill blue" style="width:' + pct + '%"></div></div>' +
      '<span class="bar-value">' + formatNumber(tokens) + '</span></div>';
  }).join('');

  const costBars = data.map(d => {
    const pct = (d.total_cost / maxCost * 100).toFixed(1);
    return '<div class="bar-row">' +
      '<span class="bar-label">' + escapeHtml(d.date) + '</span>' +
      '<div class="bar-track"><div class="bar-fill green" style="width:' + pct + '%"></div></div>' +
      '<span class="bar-value">$' + d.total_cost.toFixed(2) + '</span></div>';
  }).join('');

  setCardBody('card-cost', [
    '<div style="margin-bottom:8px;font-size:0.8rem;font-weight:600;color:var(--blue)">Token Usage (14 days)</div>',
    '<div class="bar-chart">' + tokenBars + '</div>',
    '<div style="margin:12px 0 8px;font-size:0.8rem;font-weight:600;color:var(--green)">Cost History</div>',
    '<div class="bar-chart">' + costBars + '</div>',
  ].join(''));
}

function renderInsights() {
  const items = MOCK.insights.map(i => {
    const cls = i.implemented ? 'done' : 'pending';
    const txt = i.implemented ? '✅ Done' : '⏳ Pending';
    return '<div class="insight-item">' +
      '<div class="insight-header">' +
      '  <span class="insight-title">' + escapeHtml(truncate(i.title, 60)) + '</span>' +
      '  <span class="insight-type">' + escapeHtml(i.insight_type) + '</span>' +
      '</div>' +
      '<div class="insight-desc">' + escapeHtml(truncate(i.description, 80)) + '</div>' +
      '<div style="margin-top:2px;display:flex;gap:6px;align-items:center;font-size:0.65rem;color:var(--text2)">' +
      '  <span class="insight-status ' + cls + '">' + txt + '</span>' +
      '  <span>' + (i.confidence != null ? 'conf: ' + i.confidence.toFixed(2) : '') + '</span>' +
      '  <span>' + timeAgo(i.created_at) + '</span>' +
      '</div></div>';
  }).join('');
  setCardBody('card-insights', items);
}

function renderSkills() {
  const top = MOCK.skills;
  const maxCount = Math.max(...top.map(s => s.times_loaded), 1);
  const items = top.map(s => {
    const pct = (s.times_loaded / maxCount * 100).toFixed(0);
    return '<div class="skill-row">' +
      '<span class="skill-name">' + escapeHtml(s.skill_name) + '</span>' +
      '<div style="display:flex;align-items:center;gap:6px;flex:1;margin:0 8px">' +
      '  <div style="height:6px;background:var(--bg3);border-radius:3px;flex:1;overflow:hidden">' +
      '    <div style="height:100%;width:' + pct + '%;background:var(--cyan);border-radius:3px"></div>' +
      '  </div></div>' +
      '<span class="skill-count">' + s.times_loaded + '</span></div>';
  }).join('');
  setCardBody('card-skills', items);
}

function renderPatterns() {
  const top = MOCK.patterns;
  const maxFreq = Math.max(...top.map(p => p.frequency), 1);
  const items = top.map(p => {
    const pct = (p.frequency / maxFreq * 100).toFixed(0);
    return '<div class="skill-row">' +
      '<span style="color:var(--purple);font-weight:500">' + escapeHtml(p.pattern_type) + '</span>' +
      '<div style="display:flex;align-items:center;gap:6px;flex:1;margin:0 8px">' +
      '  <div style="height:6px;background:var(--bg3);border-radius:3px;flex:1;overflow:hidden">' +
      '    <div style="height:100%;width:' + pct + '%;background:var(--purple);border-radius:3px"></div>' +
      '  </div></div>' +
      '<span class="skill-count">×' + p.frequency + '</span></div>' +
      (p.description ? '<div style="font-size:0.7rem;color:var(--text2);padding:0 0 4px 0;margin-top:-2px">' + escapeHtml(truncate(p.description, 60)) + '</div>' : '');
  }).join('');
  setCardBody('card-patterns', items);
}

function renderSessions() {
  const items = MOCK.sessions.map(s => {
    const modelStr = s.model ? s.model : '—';
    return '<div class="session-row">' +
      '<div style="display:flex;flex-direction:column;gap:1px;min-width:0;flex:1">' +
      '  <div class="session-id" title="' + escapeHtml(s.session_id) + '">' + escapeHtml(shortId(s.session_id)) + '</div>' +
      '  <div class="session-meta">' + (s.source || '—') + ' · ' + timeAgo(s.started_at) + '</div></div>' +
      '<div style="display:flex;align-items:center;gap:6px">' +
      '  <span class="session-model">' + escapeHtml(truncate(modelStr, 16)) + '</span>' +
      '  <span style="font-size:0.7rem;color:var(--text2)">' + (s.status === 'active' ? '🟢' : '✅') + '</span>' +
      '</div></div>';
  }).join('');
  setCardBody('card-sessions', items);
}

function renderTools() {
  const top = MOCK.tools;
  const maxCalls = Math.max(...top.map(t => t.calls), 1);
  const items = top.map(t => {
    const pct = (t.calls / maxCalls * 100).toFixed(0);
    const failPct = t.calls > 0 ? ((t.failures || 0) / t.calls * 100).toFixed(0) : 0;
    return '<div class="skill-row">' +
      '<span style="color:var(--orange);font-weight:500">' + escapeHtml(t.tool_name) + '</span>' +
      '<div style="display:flex;align-items:center;gap:6px;flex:1;margin:0 8px">' +
      '  <div style="height:6px;background:var(--bg3);border-radius:3px;flex:1;overflow:hidden">' +
      '    <div style="height:100%;width:' + pct + '%;background:var(--orange);border-radius:3px"></div>' +
      '  </div></div>' +
      '<span class="skill-count" title="' + (t.failures || 0) + ' failures">' +
        t.calls + (failPct > 0 && failPct > 0 ? ' <span style="color:var(--red)">⚠' + failPct + '%</span>' : '') +
      '</span></div>';
  }).join('');
  setCardBody('card-tools', items);
}

// ── Build & Render ──────────────────────────────────────────────────────

function buildCards() {
  const grid = $('dashboardGrid');
  const cards = [
    ['card-health',  'System Health',     'col-3'],
    ['card-stats',   'Quick Stats',       'col-9'],
    ['card-cost',    'Cost & Usage',      'col-4'],
    ['card-insights','Recent Insights',   'col-4'],
    ['card-skills',  'Skill Usage',       'col-4'],
    ['card-patterns','Active Patterns',   'col-4'],
    ['card-sessions','Recent Sessions',   'col-4'],
    ['card-tools',   'Tool Call Breakdown','col-4'],
  ];
  cards.forEach(([id, title, cols]) => {
    grid.appendChild(makeCard(id, title, cols));
  });
}

document.addEventListener('DOMContentLoaded', () => {
  buildCards();
  renderSystemHealth();
  renderQuickStats();
  renderCostUsage();
  renderInsights();
  renderSkills();
  renderPatterns();
  renderSessions();
  renderTools();
});
</script>
</body>
</html>
